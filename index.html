<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familia Bet - Sistema</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script>
        localStorage.setItem('cuidado_authenticated', 'true');
        localStorage.setItem('familiabet_login_time', Date.now().toString());
    </script>
    <link rel="stylesheet" crossorigin href="./assets/index-atQao4Jh.css">
    <style>
        #root-loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        #root-loading.hidden { opacity: 0; pointer-events: none; }
        #root-loading img { width: 100px; height: 100px; margin-bottom: 20px; animation: pulse 1.5s ease-in-out infinite; }
        #root-loading p { color: white; font-size: 18px; font-weight: 600; }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 15px; }
        @keyframes spin { to { transform: rotate(360deg)); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body>
    <div id="root-loading">
        <img src="assets/brasao-web.png" alt="Familia Bet">
        <p>Carregando Sistema...</p>
        <div class="loading-spinner"></div>
    </div>
    <div id="root"></div>
    <style>
      #agenda-v2-embedded { position:fixed; top:65px; left:260px; right:0; bottom:0; z-index:30; background:#f4f6fb; display:none; }
      #agenda-v2-embedded.open { display:flex; flex-direction:column; }
      #agenda-v2-embedded .agenda-v2-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 16px; background:#fff; border-bottom:1px solid #e3e8f1; font:600 14px system-ui,sans-serif; color:#1e335c; }
      #agenda-v2-embedded .agenda-v2-toolbar button { border:0; background:#e8edf9; border-radius:7px; padding:7px 12px; cursor:pointer; color:#243d72; font-weight:600; }
      #agenda-v2-embedded iframe { flex:1; width:100%; border:0; background:#f4f6fb; }
      @media(max-width:700px) { #agenda-v2-embedded { left:0; top:65px; } }
    </style>
    <script>
      // Agenda V2 incorporada no painel; nenhuma alteração no login ou nos outros módulos.
      (function() {
        function ensureAgenda() {
          let panel=document.getElementById('agenda-v2-embedded');
          if(panel) return panel;
          panel=document.createElement('section');
          panel.id='agenda-v2-embedded';
          panel.setAttribute('aria-label','Agenda de Eventos V2');
          const toolbar=document.createElement('div');
          toolbar.className='agenda-v2-toolbar';
          const title=document.createElement('span');
          title.textContent='Agenda de Eventos';
          const close=document.createElement('button');
          close.type='button';
          close.textContent='Fechar agenda';
          close.onclick=function(){panel.classList.remove('open')};
          toolbar.append(title,close);
          const frame=document.createElement('iframe');
          frame.title='Agenda de Eventos V2';
          frame.loading='eager';
          frame.dataset.url='/familiabet/agenda-v2/';
          panel.append(toolbar,frame);
          document.body.append(panel);
          return panel;
        }
        document.addEventListener('click',function(event){
          const clicked=event.target instanceof Element ? event.target : null;
          if(!clicked) return;
          let node=clicked, menuLabel=null;
          while(node && node!==document.body){
            if(node.textContent && node.textContent.trim()==='Agenda de Eventos'){menuLabel=node;break}
            node=node.parentElement;
          }
          if(!menuLabel || menuLabel.closest('#agenda-v2-embedded')) return;
          const rect=menuLabel.getBoundingClientRect();
          if(rect.left>=280 || rect.width>280) return;
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          const panel=ensureAgenda(),frame=panel.querySelector('iframe');
          if(!frame.src)frame.src=frame.dataset.url;
          panel.classList.add('open');
        },true);
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-8QbyIBO3.js"></script>
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loading = document.getElementById('root-loading');
                if (loading) { loading.classList.add('hidden'); setTimeout(function() { loading.style.display = 'none'; }, 500); }
            }, 1500);
        });
        function logout() {
            localStorage.removeItem('cuidado_authenticated');
            localStorage.removeItem('familiabet_login_time');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
